# polybuild telemetry + remote-cache stack.
#
#   bazel-remote  : the remote build cache. Bazel reads/writes it; Prometheus
#                   scrapes its /metrics endpoint for cache hit/miss counters.
#   pushgateway   : sink for per-build metrics from tools/telemetry/bep_exporter.
#   prometheus    : scrapes bazel-remote + pushgateway, stores the time series.
#   grafana       : pre-provisioned "polybuild build health" dashboard.
#
# Start everything:  docker compose up -d
# Grafana:           http://localhost:3000   (anonymous admin access)
services:
  bazel-remote:
    image: buchgr/bazel-remote-cache:v2.4.4
    command:
      - --dir=/data
      - --max_size=5
      - --http_address=0.0.0.0:8080
      - --grpc_address=0.0.0.0:9092
      # Exposes Prometheus counters (incl. cache hits/misses) on the HTTP port.
      - --enable_endpoint_metrics
    ports:
      - "8080:8080"   # HTTP cache API + /metrics
      - "9092:9092"   # gRPC cache API (used by --config=remote)
    volumes:
      - bazel-remote-data:/data

  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - bazel-remote
      - pushgateway

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  bazel-remote-data:
