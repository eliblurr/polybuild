name: ci

# Demonstrates the remote cache end-to-end on CI:
#   1. build once to populate bazel-remote
#   2. wipe the local Bazel state entirely (clean --expunge)
#   3. build again — every artifact must now come from the remote cache
#   4. read bazel-remote's own metrics and assert the hit rate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start bazel-remote cache
        working-directory: deploy/telemetry
        run: |
          docker compose up -d bazel-remote
          # Wait for the cache HTTP endpoint to accept connections.
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/status && break
            sleep 1
          done

      # Bazelisk honours .bazelversion, so CI builds with the pinned Bazel.
      - name: Install Bazelisk
        run: |
          sudo curl -sSLo /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel

      - name: Cold build — populate the remote cache
        run: bazel build --config=ci //...

      - name: Wipe local state
        run: bazel clean --expunge

      # Snapshot the cache counters BEFORE the rebuild. The cold build above is
      # all-misses by definition (it populated an empty cache), so the hit rate
      # is only meaningful for the cache-served rebuild in isolation. Measuring
      # the delta around just that build excludes the cold populate.
      - name: Snapshot cache counters before rebuild
        run: curl -sf http://localhost:8080/metrics > /tmp/metrics-before.txt

      - name: Cache-served build — should pull everything from bazel-remote
        run: bazel build --config=ci //...

      - name: Export build telemetry
        run: |
          bazel run //tools/telemetry:bep_exporter -- \
            --bep-file "${PWD}/bazel-bep.json" --dry-run

      - name: Assert remote cache hit rate
        run: |
          curl -sf http://localhost:8080/metrics > /tmp/metrics-after.txt
          # Delta of hit/miss counters across the two snapshots = traffic from
          # the cache-served rebuild only. status="hit"/"miss" filters out
          # uploads and contains-checks, which have no hit/miss semantics.
          awk '
            FNR == 1 { fileidx++ }
            /^bazel_remote_incoming_requests_total/ {
              val = $NF + 0
              if ($0 ~ /status="hit"/)  { if (fileidx == 1) hb += val; else ha += val }
              if ($0 ~ /status="miss"/) { if (fileidx == 1) mb += val; else ma += val }
            }
            END {
              hits = ha - hb
              misses = ma - mb
              total = hits + misses
              printf "cache-served rebuild: %d hits / %d misses\n", hits, misses
              if (total <= 0) {
                print "::error::no hit/miss requests recorded for the rebuild"
                exit 1
              }
              rate = 100 * hits / total
              printf "remote cache hit rate (rebuild): %.0f%%\n", rate
              if (rate < 80) {
                printf "::error::cache hit rate %.0f%% below 80%% threshold\n", rate
                exit 1
              }
            }
          ' /tmp/metrics-before.txt /tmp/metrics-after.txt
